[package]
name = "pithos_lib"
description = "Library and components for encrypting / compressing pithos (.pith) files"
version = "0.8.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = ["crates-io"]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "!benches/**",
    "!tests/**",
]
autobenches = false

[lib]
bench = false

[features]
fuzzing = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
blake2 = "0.10.6"
blake3 = "1.8.2"
byteorder = "1.5.0"
chacha20poly1305 = "0.11.0"
crc32fast = "1.5.0"
cap-std = "4.0.2"
digest = "0.11.3"
fastcdc = "4.0.1"
hkdf = "0.13.0"
indexmap = "2.11.0"
integer-encoding = "4.1.0"
libc = "0.2.178"
pkcs8 = { version = "0.11.0", features = ["pem", "alloc"] }
ro-crate-rs = { version = "0.5.1", default-features = false }
rustix = { version = "1.1.4", features = ["fs"] }
sha2 = "0.11.0"
shake = "0.1.0"
thiserror = { workspace = true }
tracing = { workspace = true }
x25519-dalek = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate", "time"] }
zstd = "0.13.3"
zeroize = "1.8.2"

[dev-dependencies]
criterion = "0.8.2"
peak_alloc = "0.3.0"
proptest = "1.6.0"
tempfile = "3.21"
trybuild = "1.0.104"

[[bench]]
name = "archive_path"
harness = false

[[bench]]
name = "block_pipeline"
harness = false

[[bench]]
name = "archive_io"
harness = false

[[bench]]
name = "append"
harness = false

[[bench]]
name = "adapters"
harness = false
